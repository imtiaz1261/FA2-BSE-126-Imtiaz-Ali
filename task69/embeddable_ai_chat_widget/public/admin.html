<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Widget Admin</title><style>body{margin:0;font-family:Arial;background:#f5f7fb}.top{background:#111827;color:#fff;padding:18px 7%}.layout{max-width:1100px;margin:30px auto;padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 8px 25px #0001}label{display:block;font-weight:600;margin:12px 0 6px}input,textarea,select{width:100%;padding:10px;border:1px solid #d6dae2;border-radius:8px;box-sizing:border-box}textarea{min-height:80px}button{margin-top:15px;padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}pre{white-space:pre-wrap;background:#f3f4f6;padding:12px;border-radius:8px;font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}}</style></head><body><div class="top"><h2>AI Widget Admin Panel</h2><small>Two demo tenants</small></div><div class="layout"><div class="card"><h3>Tenant</h3><select id="tenant"></select><div id="form"></div><button id="save">Save configuration</button></div><div class="card"><h3>Embed code</h3><pre id="embed"></pre><button id="copy">Copy embed code</button><p id="status"></p></div></div><script>
const sel=document.getElementById("tenant"),form=document.getElementById("form"),embed=document.getElementById("embed");let ts={};
const esc=x=>String(x).replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;");
async function load(){let a=await(await fetch("/api/tenants")).json();ts=Object.fromEntries(a.map(x=>[x.bot_id,x]));sel.innerHTML=a.map(x=>`<option value="${x.bot_id}">${x.name} (${x.bot_id})</option>`).join("");render()}
function render(){let t=ts[sel.value];form.innerHTML=`<label>Name</label><input id="name" value="${esc(t.name)}"><label>Color</label><input id="color" type="color" value="${t.color}"><label>Logo URL</label><input id="logo" value="${esc(t.logo)}"><label>Welcome</label><textarea id="welcome">${esc(t.welcome)}</textarea><label>Instructions</label><textarea id="instructions">${esc(t.instructions)}</textarea>`;embed.textContent=`<script src="${location.origin}/widget.js" data-bot-id="${sel.value}"><\\/script>`}
sel.onchange=render;document.getElementById("save").onclick=async()=>{let id=sel.value,p={name:name.value,color:color.value,logo:logo.value,welcome:welcome.value,instructions:instructions.value};ts[id]=await(await fetch("/api/tenants/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)})).json();status.textContent="Saved successfully.";render()};document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(embed.textContent);status.textContent="Copied."};load();
</script></body></html>
