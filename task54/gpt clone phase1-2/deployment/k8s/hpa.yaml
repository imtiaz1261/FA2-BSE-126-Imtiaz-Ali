# Horizontal Pod Autoscaler (HPA) for Backend and Worker scaling
# Requires Metrics Server to be installed: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chatline-backend-hpa
  namespace: chatline
  labels:
    app: chatline
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chatline-backend
  minReplicas: 2
  maxReplicas: 10

  # Metrics for scaling
  metrics:
    # CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  # Scaling behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min

    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100  # Double pods
          periodSeconds: 15
        - type: Pods
          value: 2  # Or add 2 pods
          periodSeconds: 15
      selectPolicy: Max

---
# HPA for Worker scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chatline-worker-hpa
  namespace: chatline
  labels:
    app: chatline
    component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chatline-worker
  minReplicas: 1
  maxReplicas: 5

  # Metrics for scaling
  metrics:
    # CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

    # Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85

  # Scaling behavior (more aggressive for workers)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 200  # Triple pods quickly
          periodSeconds: 15
      selectPolicy: Max

---
# HPA for Frontend (minimal scaling - usually static)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chatline-frontend-hpa
  namespace: chatline
  labels:
    app: chatline
    component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chatline-frontend
  minReplicas: 2
  maxReplicas: 5

  # Metrics
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

  # Conservative scaling
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
