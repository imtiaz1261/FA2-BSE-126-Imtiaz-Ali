# Kubernetes Deployment for React Frontend
# Serves static assets through Nginx with SPA routing

apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatline-frontend
  namespace: chatline
  labels:
    app: chatline
    component: frontend
    version: v1
spec:
  replicas: 2  # Start with 2 for redundancy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chatline
      component: frontend
  template:
    metadata:
      labels:
        app: chatline
        component: frontend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      # Pod disruption budget
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values:
                        - frontend
                topologyKey: kubernetes.io/hostname

      # Service account
      serviceAccountName: chatline-frontend

      # Containers
      containers:
        - name: frontend
          image: chatline/frontend:latest  # Replace with your registry
          imagePullPolicy: IfNotPresent

          # Ports
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # Liveness Probe
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness Probe
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          # Startup Probe
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30

          # Resource Limits - Frontend is lightweight
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Security Context
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # Volume Mounts
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run

      # Volumes
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-pid
          emptyDir: {}

      # Pod Security
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      # Restart Policy
      restartPolicy: Always

      # Termination Grace Period
      terminationGracePeriodSeconds: 15

      # DNS Policy
      dnsPolicy: ClusterFirst

---
# Service for Frontend
apiVersion: v1
kind: Service
metadata:
  name: chatline-frontend
  namespace: chatline
  labels:
    app: chatline
    component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: chatline
    component: frontend
  sessionAffinity: None

---
# ServiceAccount for Frontend
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatline-frontend
  namespace: chatline
  labels:
    app: chatline
    component: frontend
