# Kubernetes Secrets - Store sensitive configuration
# NOTE: This is an EXAMPLE file. Replace with actual secrets before deploying.
# NEVER commit real secrets to Git!
#
# To create secrets from this file:
#   kubectl apply -f deployment/k8s/secrets.example.yaml --namespace=chatline
#
# Or create individually:
#   kubectl create secret generic chatline-secrets \
#     --from-literal=JWT_SECRET_KEY=your-secret-key \
#     --from-literal=DATABASE_URL=postgresql+asyncpg://... \
#     -n chatline

apiVersion: v1
kind: Secret
metadata:
  name: chatline-secrets
  namespace: chatline
  labels:
    app: chatline
    component: secrets
type: Opaque
stringData:
  # ========================================================================
  # JWT & Authentication
  # ========================================================================
  
  # Generate with: openssl rand -hex 32
  JWT_SECRET_KEY: "change-this-to-a-random-secret-key-in-production"
  
  # ========================================================================
  # Database
  # ========================================================================
  
  # PostgreSQL connection string for async operations
  DATABASE_URL: "postgresql+asyncpg://username:password@postgres.chatline.svc.cluster.local:5432/chatline"
  
  # PostgreSQL connection string for sync operations (Alembic migrations)
  DATABASE_URL_SYNC: "postgresql+psycopg2://username:password@postgres.chatline.svc.cluster.local:5432/chatline"
  
  # ========================================================================
  # Redis
  # ========================================================================
  
  REDIS_URL: "redis://:your-redis-password@redis.chatline.svc.cluster.local:6379/0"
  
  # ========================================================================
  # OAuth Configuration
  # ========================================================================
  
  GOOGLE_CLIENT_ID: "your-google-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"
  
  GITHUB_CLIENT_ID: "your-github-client-id"
  GITHUB_CLIENT_SECRET: "your-github-client-secret"
  
  # ========================================================================
  # Object Storage (S3 / AWS / Cloudflare R2)
  # ========================================================================
  
  S3_ACCESS_KEY: "your-aws-access-key"
  S3_SECRET_KEY: "your-aws-secret-key"
  S3_ENDPOINT: "https://s3.amazonaws.com"
  
  # For Cloudflare R2:
  # S3_ENDPOINT: "https://your-account-id.r2.cloudflarestorage.com"
  # S3_ACCESS_KEY: "your-r2-access-key"
  # S3_SECRET_KEY: "your-r2-secret-key"
  
  # ========================================================================
  # Stripe Billing
  # ========================================================================
  
  STRIPE_SECRET_KEY: "sk_live_your_stripe_secret_key"
  STRIPE_PUBLISHABLE_KEY: "pk_live_your_stripe_publishable_key"
  STRIPE_WEBHOOK_SECRET: "whsec_your_webhook_secret"
  
  # ========================================================================
  # Email Configuration
  # ========================================================================
  
  SMTP_USERNAME: "your-email@example.com"
  SMTP_PASSWORD: "your-email-password"
  
  # ========================================================================
  # Monitoring & Observability
  # ========================================================================
  
  # Sentry DSN for error tracking
  SENTRY_DSN: "https://your-sentry-key@sentry.io/project-id"
  
  # ========================================================================
  # Cookie Configuration
  # ========================================================================
  
  COOKIE_DOMAIN: ".chatline.example.com"

---
# TLS Certificate Secret (for HTTPS)
# Create with: kubectl create secret tls chatline-tls --cert=path/to/cert.crt --key=path/to/key.key -n chatline
apiVersion: v1
kind: Secret
metadata:
  name: chatline-tls
  namespace: chatline
  labels:
    app: chatline
    component: tls
type: kubernetes.io/tls
data:
  # Base64-encoded certificate
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCi4uLgotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0tCg==
  # Base64-encoded private key
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCi4uLgotLS0tLUVORCBQUklWQVRFIEtFWS0tLS0tCg==
