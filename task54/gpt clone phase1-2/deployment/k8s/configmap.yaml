# Kubernetes ConfigMap for non-sensitive configuration
# Store secrets in Secrets instead

apiVersion: v1
kind: ConfigMap
metadata:
  name: chatline-config
  namespace: chatline
  labels:
    app: chatline
    component: config
data:
  # Application
  APP_NAME: "Chatline"
  ENVIRONMENT: "production"
  IS_PRODUCTION: "true"
  LOG_LEVEL: "INFO"

  # Frontend
  FRONTEND_URL: "https://chatline.example.com"

  # Database
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"

  # JWT
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # Cookies
  COOKIE_SECURE: "true"
  COOKIE_HTTP_ONLY: "true"
  COOKIE_SAME_SITE: "lax"

  # S3/Object Storage (example for AWS)
  S3_REGION: "us-east-1"
  S3_ENDPOINT: "https://s3.amazonaws.com"
  S3_BUCKET: "chatline-documents"

  # Usage Limits
  FREE_DAILY_MESSAGES: "20"
  PLUS_DAILY_MESSAGES: "300"
  PRO_DAILY_MESSAGES: "1000"

  # Memory & Personalization
  MEMORY_ENABLED: "true"
  MEMORY_EXTRACTION_MODEL: "gpt-4-turbo"
  MEMORY_EXTRACTION_TEMPERATURE: "0.3"
  MEMORY_RETENTION_DAYS: "365"
  MEMORY_MAX_ITEMS: "1000"
  MEMORY_CONTEXT_INJECTION_COUNT: "5"
  MEMORY_RETRIEVAL_THRESHOLD: "0.5"

  # Embeddings
  EMBEDDINGS_MODEL: "text-embedding-3-small"
  EMBEDDINGS_DIMENSION: "1536"

  # Rate Limiting
  LOGIN_RATE_LIMIT: "5/minute"
  API_RATE_LIMIT: "100/minute"

  # Monitoring
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_PORT: "8001"
  SENTRY_ENVIRONMENT: "production"
  SENTRY_TRACES_SAMPLE_RATE: "0.1"
  SENTRY_PROFILES_SAMPLE_RATE: "0.1"

  # Feature Flags
  ENABLE_REGISTRATION: "true"
  ENABLE_SOCIAL_LOGIN: "true"
  ENABLE_RAG: "true"
  ENABLE_AGENTS: "true"
  ENABLE_MEMORY: "true"

  # Worker
  WORKER_CONCURRENCY: "4"
  WORKER_TIMEOUT: "300"

  # Document Processing
  MAX_DOCUMENT_SIZE_MB: "100"
  CHUNK_SIZE: "1024"
  CHUNK_OVERLAP: "128"

  # Agent Sandbox
  AGENT_TIMEOUT_SECONDS: "30"
  AGENT_MEMORY_LIMIT_MB: "512"
  AGENT_CPU_LIMIT: "1"
