# Kubernetes Deployment for Orchestrator Service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: code-alpha
  labels:
    app: orchestrator
    component: orchestration
    version: "1.0"
spec:
  replicas: 1  # Single master instance
  strategy:
    type: Recreate  # Orchestrator is stateful
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        component: orchestration
        version: "1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: code-alpha-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: orchestrator
          image: codealpha-registry/orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: SERVICE_TYPE
              value: "orchestrator"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: orchestrator-config
                  key: redis_url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: connection_string
            - name: SANDBOX_ENABLED
              value: "true"
            - name: SAFETY_MODE
              value: "strict"
            - name: MAX_WORKERS
              value: "4"
            - name: TASK_TIMEOUT_SECONDS
              value: "3600"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 60

---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: code-alpha
  labels:
    app: orchestrator
spec:
  type: ClusterIP
  selector:
    app: orchestrator
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orchestrator-pdb
  namespace: code-alpha
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: orchestrator
