# Kubernetes ConfigMaps and Secrets for Code Alpha

---
# ConfigMap for API service
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: code-alpha
  labels:
    app: code-alpha
    component: api
data:
  redis_url: "redis://redis:6379/0"
  api_port: "8000"
  workers: "4"
  log_level: "INFO"
  prometheus_enabled: "true"

---
# ConfigMap for Orchestrator service
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
  namespace: code-alpha
  labels:
    app: code-alpha
    component: orchestrator
data:
  redis_url: "redis://redis:6379/1"
  orchestrator_port: "8001"
  max_workers: "4"
  task_timeout_seconds: "3600"
  log_level: "INFO"

---
# ConfigMap for Sandbox Worker service
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-config
  namespace: code-alpha
  labels:
    app: code-alpha
    component: sandbox
data:
  redis_url: "redis://redis:6379/2"
  worker_port: "8002"
  max_concurrent_tasks: "2"
  sandbox_mode: "enabled"
  safety_mode: "strict"
  log_level: "INFO"

---
# ConfigMap for Indexing Worker service
apiVersion: v1
kind: ConfigMap
metadata:
  name: indexing-config
  namespace: code-alpha
  labels:
    app: code-alpha
    component: indexing
data:
  redis_url: "redis://redis:6379/3"
  worker_port: "8003"
  max_concurrent_tasks: "3"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  batch_size: "32"
  log_level: "INFO"

---
# Secret for PostgreSQL database connection
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: code-alpha
  labels:
    app: code-alpha
    component: database
type: Opaque
stringData:
  # Format: postgresql://user:password@host:port/dbname
  connection_string: "postgresql://codealpha:changeme@postgres:5432/codealpha"
  username: "codealpha"
  password: "changeme"

---
# Secret for Docker registry credentials (if using private registry)
apiVersion: v1
kind: Secret
metadata:
  name: docker-credentials
  namespace: code-alpha
type: kubernetes.io/dockercfg
stringData:
  .dockercfg: |
    {
      "codealpha-registry": {
        "auth": "base64_encoded_credentials_here",
        "email": "ci@codealpha.dev"
      }
    }

---
# Secret for SSL/TLS certificates
apiVersion: v1
kind: Secret
metadata:
  name: code-alpha-tls
  namespace: code-alpha
type: kubernetes.io/tls
data:
  # These are populated by cert-manager
  tls.crt: LS0tLS1CRUdJTi... # Base64 encoded cert
  tls.key: LS0tLS1CRUdJTi... # Base64 encoded key

---
# ConfigMap for Prometheus scrape configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: code-alpha
  labels:
    app: code-alpha
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'code-alpha-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - code-alpha
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: api
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

      - job_name: 'code-alpha-orchestrator'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - code-alpha
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: orchestrator
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"

      - job_name: 'code-alpha-workers'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - code-alpha
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_component]
            action: keep
            regex: workers
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"

---
# ConfigMap for application logging configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: logging-config
  namespace: code-alpha
  labels:
    app: code-alpha
    component: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Daemon       off
        Log_Level    info
        Parsers_File parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*code-alpha*.log
        Parser            docker
        Tag               kube.*
        Refresh_Interval  5

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token

    [OUTPUT]
        Name  stdout
        Match *
