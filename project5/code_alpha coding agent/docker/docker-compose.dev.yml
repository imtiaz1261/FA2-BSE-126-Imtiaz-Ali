# Docker Compose for Code Alpha - Development Environment
# Includes single instances of all services with debug logging

version: '3.8'

services:
  # Redis - Caching and job queue
  redis:
    image: redis:7-alpine
    container_name: codealpha-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    environment:
      - REDIS_LOGLEVEL=notice
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - codealpha-net-dev
    restart: unless-stopped

  # PostgreSQL - Persistent storage and audit logs
  postgres:
    image: postgres:15-alpine
    container_name: codealpha-postgres-dev
    environment:
      POSTGRES_DB: codealpha_dev
      POSTGRES_USER: codealpha
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_INITDB_ARGS: "-c log_statement=all -c log_duration=on"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codealpha"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codealpha-net-dev
    restart: unless-stopped

  # API Gateway - REST API entry point
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api-gateway
    container_name: codealpha-api-dev
    ports:
      - "8000:8000"
    volumes:
      - ..:/workspace
      - ../.codealpha:/app/.codealpha
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      ORCHESTRATOR_URL: http://orchestrator:8001
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://codealpha:devpassword123@postgres:5432/codealpha_dev
      SANDBOX_ENABLED: "true"
      AUDIT_LOG_PATH: /app/.codealpha/audit.jsonl
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - codealpha-net-dev
    restart: unless-stopped

  # Orchestrator - Task orchestration and scheduling
  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestrator
    container_name: codealpha-orchestrator-dev
    ports:
      - "8001:8001"
    volumes:
      - ..:/workspace
      - ../.codealpha:/app/.codealpha
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://codealpha:devpassword123@postgres:5432/codealpha_dev
      SANDBOX_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - codealpha-net-dev
    restart: unless-stopped

  # Sandbox Worker - Isolated tool execution
  sandbox-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sandbox-worker
    container_name: codealpha-sandbox-worker-dev
    ports:
      - "8002:8002"
    volumes:
      - ..:/workspace
      - ../.codealpha:/app/.codealpha
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      ORCHESTRATOR_URL: http://orchestrator:8001
      REDIS_URL: redis://redis:6379/2
      DATABASE_URL: postgresql://codealpha:devpassword123@postgres:5432/codealpha_dev
      SANDBOX_MODE: enabled
      SAFETY_MODE: standard
    depends_on:
      - redis
      - orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - codealpha-net-dev
    restart: unless-stopped

  # Indexing Worker - Context indexing and embeddings
  indexing-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.indexing-worker
    container_name: codealpha-indexing-worker-dev
    ports:
      - "8003:8003"
    volumes:
      - ..:/workspace
      - ../.codealpha:/app/.codealpha
      - indexing_vectors_dev:/app/vectors
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      ORCHESTRATOR_URL: http://orchestrator:8001
      REDIS_URL: redis://redis:6379/3
      DATABASE_URL: postgresql://codealpha:devpassword123@postgres:5432/codealpha_dev
      VECTOR_STORE_PATH: /app/vectors
    depends_on:
      - redis
      - orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - codealpha-net-dev
    restart: unless-stopped

volumes:
  redis_data_dev:
  postgres_data_dev:
  indexing_vectors_dev:

networks:
  codealpha-net-dev:
    driver: bridge

# Usage:
#   docker-compose -f docker/docker-compose.dev.yml up              # Start all services
#   docker-compose -f docker/docker-compose.dev.yml up -d           # Start in background
#   docker-compose -f docker/docker-compose.dev.yml logs -f         # View all logs
#   docker-compose -f docker/docker-compose.dev.yml logs -f api     # View API logs
#   docker-compose -f docker/docker-compose.dev.yml down            # Stop all services
#   docker-compose -f docker/docker-compose.dev.yml down -v         # Stop and remove volumes
#
# API Endpoints:
#   GET  http://localhost:8000/health           # API health check
#   GET  http://localhost:8000/docs             # API documentation (Swagger)
#   POST http://localhost:8000/tasks            # Create task
#   GET  http://localhost:8000/tasks/{task_id}  # Get task status
#
# Service Ports:
#   8000 - API Gateway
#   8001 - Orchestrator
#   8002 - Sandbox Worker
#   8003 - Indexing Worker
#   6379 - Redis
#   5432 - PostgreSQL
