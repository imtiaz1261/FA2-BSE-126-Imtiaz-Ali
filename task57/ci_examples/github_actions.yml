# GitHub Actions Workflow using Code Alpha CLI

name: Code Alpha - Automated Code Generation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Code generation prompt'
        required: true
        type: string

jobs:
  code-generation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Code Alpha
        run: |
          pip install -e .
          pip install typer rich pydantic fastapi uvicorn
      
      - name: Run Code Alpha
        id: codealpha
        run: |
          codealpha run "${{ github.event.inputs.prompt || 'Improve code quality and add tests' }}" \
            --repo . \
            --auto-approve-low-risk \
            --max-retries 3 \
            --json > result.json
        continue-on-error: true
      
      - name: Parse Results
        id: results
        run: |
          python << 'EOF'
          import json
          with open('result.json') as f:
            result = json.load(f)
          
          print(f"::set-output name=status::{result['status']}")
          print(f"::set-output name=files_changed::{result['metrics']['total_edits']}")
          print(f"::set-output name=tests_passed::{result['metrics']['passing_tests']}")
          EOF
      
      - name: Create Pull Request
        if: steps.codealpha.outcome == 'success'
        uses: peter-evans/create-pull-request@v4
        with:
          commit-message: 'chore: Code Alpha improvements'
          title: '[Code Alpha] Automated code improvements'
          body: |
            ## 🤖 Code Alpha Results
            
            **Status:** ${{ steps.results.outputs.status }}
            **Files Changed:** ${{ steps.results.outputs.files_changed }}
            **Tests Passed:** ${{ steps.results.outputs.tests_passed }}
            
            This PR contains automated improvements generated by Code Alpha.
            Please review carefully before merging.
          branch: code-alpha-improvements
          delete-branch: true
      
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.codealpha.outcome == 'success'
        uses: actions/github-script@v6
        with:
          script: |
            const result = require('./result.json');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `
            ## 🤖 Code Alpha Analysis
            
            - **Status:** ${result.status}
            - **Files Changed:** ${result.metrics.total_edits}
            - **Tests:** ${result.metrics.passing_tests}/${result.metrics.total_tests} passed
            - **Coverage:** ${result.metrics.coverage_delta || 'N/A'}
              `
            });
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: code-alpha-results
          path: result.json
      
      - name: Report Status
        if: always()
        run: |
          if [ "${{ steps.codealpha.outcome }}" == "success" ]; then
            echo "✅ Code Alpha completed successfully"
            exit 0
          else
            echo "❌ Code Alpha failed"
            exit 1
          fi

  # Optional: Run Code Alpha API server for more complex workflows
  api-server:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -e .
      
      - name: Start API server
        run: |
          nohup codealpha api --start &
          sleep 5
      
      - name: Create task via API
        run: |
          curl -X POST http://localhost:8000/tasks \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "Generate comprehensive test coverage",
              "repo_path": ".",
              "auto_approve_low_risk": true
            }' | tee task.json
      
      - name: Monitor task
        run: |
          TASK_ID=$(jq -r '.task_id' task.json)
          while true; do
            curl -s http://localhost:8000/tasks/$TASK_ID | jq '.status, .progress'
            sleep 5
          done
        timeout-minutes: 30
