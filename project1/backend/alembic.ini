# =============================================================
# Alembic Configuration
# =============================================================
# The database URL is NOT set here — it is read dynamically
# from settings in env.py.  This keeps secrets out of ini files.
# =============================================================

[alembic]
# Path to the migration scripts directory (relative to this file)
script_location = migrations

# Template for new migration file names
# %(year)d%(month).2d%(day).2d_%(hour).2d%(minute).2d%(second).2d  = timestamp
# %(rev)s = short revision ID
# %(slug)s = truncated message
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the timestamp in file names
timezone = UTC

# Maximum length of the slug (message) in the filename
truncate_slug_length = 40

# Colour output in terminal
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
