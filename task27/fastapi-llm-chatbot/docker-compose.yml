services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-llm-chatbot:local
    container_name: fastapi-llm-chatbot
    ports:
      - "8000:8000"
    environment:
      # Values here come from the .env file (docker compose loads it
      # automatically if present in the same directory) or you can
      # hard-set non-secret defaults directly.
      APP_NAME: ${APP_NAME:-LLM Chatbot}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      HOST: 0.0.0.0
      PORT: 8000
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-4000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

